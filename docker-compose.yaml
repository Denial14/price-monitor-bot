services:
  db:
    image: postgres:16-alpine
    environment: 
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_DB: ${DB_NAME}
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER} -d ${DB_NAME}"]
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 10s
    restart: unless-stopped

  bot:
    build: .
    command: ["/app/bot"]
    env_file: .env
    environment:
      DB_HOST: db
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped

  scanner:
    build: .
    command: ["/app/scanner"]
    env_file: .env
    environment: 
      DB_HOST: db
    depends_on:
        db:
          condition: service_healthy
    restart: unless-stopped
    
volumes:
  pgdata: